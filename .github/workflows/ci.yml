name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (iOS Simulator SDK)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The macos-15 runner image comes with an `aws/tap` Homebrew tap
      # pre-added (unrelated to this project – some other pre-installed
      # tooling), which newer Homebrew's tap-trust check now warns about on
      # every `brew install`. We don't use anything from it, so just drop
      # it rather than trusting it or disabling the check outright; `|| true`
      # keeps this a no-op on a future runner image that no longer has it.
      - name: Remove untrusted pre-installed Homebrew tap
        run: brew untap aws/tap || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Bluetooth doesn't work in the Simulator (see README), so this only
      # verifies the app (and, now that it's embedded, the UnchainWatch
      # companion too) compiles & links — it can't exercise the BLE/FTMS/
      # HealthKit/WatchConnectivity code paths, which still need a real
      # iPhone (and, for the Watch companion, a paired Watch). Deliberately
      # no `-sdk` override: `Unchain` now embeds `UnchainWatch` as a
      # dependency (see project.yml), and a blanket `-sdk iphonesimulator`
      # would wrongly force *that* target to build against the iOS SDK too
      # instead of its own watchOS one – letting each target resolve its own
      # platform, with signing disabled, builds cleanly for both.
      - name: Build
        run: |
          xcodebuild build \
            -project Unchain.xcodeproj \
            -target Unchain \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
