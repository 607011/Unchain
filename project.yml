name: Unchain
options:
  bundleIdPrefix: net.ersatzworld
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true
  # English source, German added via Localizable.xcstrings/InfoPlist.xcstrings
  # (see Unchain/Resources) – the String Catalogs themselves declare which
  # languages they carry, this is just the project's own "Development
  # Language" setting.
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
# Project-level settings the target inherits rather than overrides – exactly
# what Xcode's own "Update to Recommended Settings" prompt asks for
# (DEVELOPMENT_TEAM here instead of duplicated per-target; sandboxed script
# build phases; String Catalog symbol generation, currently a no-op since
# there are no `.xcstrings` files yet, but keeps Xcode from nagging about it
# once there are).
settings:
  base:
    DEVELOPMENT_TEAM: 64627RE2QD
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  Unchain:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Unchain
    dependencies:
      # Embeds the watch app inside Unchain.app/Watch, the modern (Xcode
      # 14+/watchOS 7+) single-target companion-app format – no separate
      # "WatchKit Extension" target needed, unlike the old pre-2020 layout.
      - target: UnchainWatch
        embed: true
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        # iPhone: portrait-only, as before. `~ipad` overrides this just for
        # iPad, which also allows landscape – all *four* orientations
        # (including upside-down), since Apple requires that on iPad unless
        # the app opts out of Split View/Slide Over/Stage Manager via
        # `UIRequiresFullScreen` (which this app deliberately doesn't, so it
        # can be used in Split View) – omitting one, as before, is a build
        # warning ("All interface orientations must be supported unless the
        # app requires full screen"), not just a style nit.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: "Unchain needs Bluetooth to find and control your smart trainer and, optionally, a heart rate strap."
        NSHealthUpdateUsageDescription: "Unchain uses this to save your completed indoor workouts, including calories and heart rate, to the Health app."
        NSHealthShareUsageDescription: "Unchain reads your most recent body weight to estimate calories burned during walk/run workouts, and your date of birth and most recent resting heart rate to estimate the in-app heart rate zones."
        # `bluetooth-central`: keeps delivering the connected trainer's/HR
        # strap's characteristic notifications while the app is backgrounded
        # instead of suspending them immediately, which is what lets a
        # running workout keep progressing (see `WorkoutSession`) if the
        # rider switches to another app mid-ride. `audio`: lets the interval
        # beep (see "Interval Sound" in Settings) actually play while
        # backgrounded/screen-locked instead of being silenced. Neither
        # covers the OS fully terminating the process under memory pressure
        # rather than just suspending it – that would need CoreBluetooth
        # state restoration on top of this, which isn't implemented.
        UIBackgroundModes:
          - bluetooth-central
          - audio
    entitlements:
      path: Generated/Unchain.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.ersatzworld.unchain
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic

  # Minimal Watch companion: Start/Stop only, no live power/heart rate
  # display (see WatchWorkoutManager's doc comment for why this exists at
  # all – it's what lets Apple Fitness add Resting/Basal Energy on top of
  # Unchain's own Active-Energy figure for "Total Calories", which a lone
  # iPhone reliably can't). Scoped to Indoor Cycling only, enforced on the
  # iOS side (`ControlView.configureWatchCompanion`).
  UnchainWatch:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: UnchainWatch
    info:
      path: Generated/UnchainWatchInfo.plist
      properties:
        UILaunchScreen: {}
        WKApplication: true
        WKCompanionAppBundleIdentifier: net.ersatzworld.unchain
        # Without this, the Watch app list/install prompt shows the product
        # name ("UnchainWatch") instead of a proper display name.
        CFBundleDisplayName: Unchain
        NSHealthUpdateUsageDescription: "Unchain uses this to save this cycling workout to Health."
        # Keeps the workout session (and this app) running while the wrist
        # is down / the watch face has taken over – without this, iOS
        # suspends the app and the `HKWorkoutSession` along with it well
        # before a real ride is over.
        WKBackgroundModes:
          - workout-processing
    entitlements:
      path: Generated/UnchainWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.ersatzworld.unchain.watchkitapp
        TARGETED_DEVICE_FAMILY: "4" # Apple Watch
        SWIFT_VERSION: "5.0"
        WATCHOS_DEPLOYMENT_TARGET: "9.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
