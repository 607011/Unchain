name: Unchain
options:
  bundleIdPrefix: net.ersatzworld
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  Unchain:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Unchain
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        # iPhone: portrait-only, as before. `~ipad` overrides this just for
        # iPad, which also allows landscape.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: "Unchain needs Bluetooth to find and control your smart trainer and, optionally, a heart rate strap."
        NSHealthUpdateUsageDescription: "Unchain uses this to save your completed indoor workouts, including calories and heart rate, to the Health app."
        NSHealthShareUsageDescription: "Unchain reads your most recent body weight to estimate calories burned during walk/run workouts, and your date of birth to estimate a max heart rate for the in-app heart rate zones."
        # `bluetooth-central`: keeps delivering the connected trainer's/HR
        # strap's characteristic notifications while the app is backgrounded
        # instead of suspending them immediately, which is what lets a
        # running workout keep progressing (see `WorkoutSession`) if the
        # rider switches to another app mid-ride. `audio`: lets the interval
        # beep (see "Interval Sound" in Settings) actually play while
        # backgrounded/screen-locked instead of being silenced. Neither
        # covers the OS fully terminating the process under memory pressure
        # rather than just suspending it – that would need CoreBluetooth
        # state restoration on top of this, which isn't implemented.
        UIBackgroundModes:
          - bluetooth-central
          - audio
    entitlements:
      path: Generated/Unchain.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.ersatzworld.unchain
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 64627RE2QD
