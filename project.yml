name: Unchain
options:
  bundleIdPrefix: net.ersatzworld
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # English source, German added via Localizable.xcstrings/InfoPlist.xcstrings
  # (see Unchain/Resources) – the String Catalogs themselves declare which
  # languages they carry, this is just the project's own "Development
  # Language" setting.
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
# Project-level settings the target inherits rather than overrides – exactly
# what Xcode's own "Update to Recommended Settings" prompt asks for
# (DEVELOPMENT_TEAM here instead of duplicated per-target; sandboxed script
# build phases; String Catalog symbol generation, currently a no-op since
# there are no `.xcstrings` files yet, but keeps Xcode from nagging about it
# once there are).
settings:
  base:
    DEVELOPMENT_TEAM: 64627RE2QD
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  Unchain:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Unchain
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        # iPhone: portrait-only, as before. `~ipad` overrides this just for
        # iPad, which also allows landscape – all *four* orientations
        # (including upside-down), since Apple requires that on iPad unless
        # the app opts out of Split View/Slide Over/Stage Manager via
        # `UIRequiresFullScreen` (which this app deliberately doesn't, so it
        # can be used in Split View) – omitting one, as before, is a build
        # warning ("All interface orientations must be supported unless the
        # app requires full screen"), not just a style nit.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: "Unchain needs Bluetooth to find and control your smart trainer and, optionally, a heart rate strap."
        NSHealthUpdateUsageDescription: "Unchain uses this to save your completed indoor workouts, including calories and heart rate, to the Health app."
        NSHealthShareUsageDescription: "Unchain reads your most recent body weight to estimate calories burned during walk/run workouts, and your date of birth to estimate a max heart rate for the in-app heart rate zones."
        # `bluetooth-central`: keeps delivering the connected trainer's/HR
        # strap's characteristic notifications while the app is backgrounded
        # instead of suspending them immediately, which is what lets a
        # running workout keep progressing (see `WorkoutSession`) if the
        # rider switches to another app mid-ride. `audio`: lets the interval
        # beep (see "Interval Sound" in Settings) actually play while
        # backgrounded/screen-locked instead of being silenced. Neither
        # covers the OS fully terminating the process under memory pressure
        # rather than just suspending it – that would need CoreBluetooth
        # state restoration on top of this, which isn't implemented.
        UIBackgroundModes:
          - bluetooth-central
          - audio
    entitlements:
      path: Generated/Unchain.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.ersatzworld.unchain
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
