name: Bahoo
options:
  bundleIdPrefix: com.oliverlau
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  Bahoo:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Bahoo
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        # iPhone: portrait-only, as before. `~ipad` overrides this just for
        # iPad, which also allows landscape.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: "Bahoo needs Bluetooth to find and control your smart trainer and, optionally, a heart rate strap."
        NSHealthUpdateUsageDescription: "Bahoo uses this to save your completed indoor workouts, including calories and heart rate, to the Health app."
        NSHealthShareUsageDescription: "Bahoo reads your most recent body weight to estimate calories burned during walk/run workouts, and your date of birth to estimate a max heart rate for the in-app heart rate zones."
        # Deliberately NO UIBackgroundModes entry: the app is only meant to run in the foreground.
    entitlements:
      path: Generated/Bahoo.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverlau.bahoo
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 64627RE2QD
