name: Bahoo
options:
  bundleIdPrefix: com.oliverlau
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  Bahoo:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Bahoo
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: "Bahoo needs Bluetooth to find and control your smart trainer and, optionally, a heart rate strap."
        NSHealthUpdateUsageDescription: "Bahoo uses this to save your completed indoor workouts to the Health app."
        # Deliberately NO UIBackgroundModes entry: the app is only meant to run in the foreground.
    entitlements:
      path: Generated/Bahoo.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverlau.bahoo
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2U3HL5VWY3
